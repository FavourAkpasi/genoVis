name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck, lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:coverage
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-head
          path: coverage
          if-no-files-found: ignore

  # Coverage of the branch the PR targets, so the report can show the delta.
  baseline:
    name: Baseline coverage
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # The target branch may predate the coverage setup; a missing baseline only drops the delta.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.base_ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run --coverage.enabled --coverage.reporter=json-summary --coverage.reportOnFailure
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-base
          path: coverage
          if-no-files-found: ignore

  # Separate job so the PR-write token never runs `npm ci` (dependency install scripts).
  report:
    name: Coverage report
    if: always() && github.event_name == 'pull_request'
    needs: [checks, baseline]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      # The action reads thresholds from vitest.config.ts.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: coverage-head
          path: coverage
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: coverage-base
          path: coverage-base
      - name: Report coverage (with delta vs target branch)
        if: hashFiles('coverage/coverage-summary.json') != '' && hashFiles('coverage-base/coverage-summary.json') != ''
        uses: davelosert/vitest-coverage-report-action@8f86cfb56ed6d5613ea8cdc5259f207fbfd51ece # v2.13.1
        with:
          vite-config-path: vitest.config.ts
          json-summary-compare-path: coverage-base/coverage-summary.json
      - name: Report coverage
        if: hashFiles('coverage/coverage-summary.json') != '' && hashFiles('coverage-base/coverage-summary.json') == ''
        uses: davelosert/vitest-coverage-report-action@8f86cfb56ed6d5613ea8cdc5259f207fbfd51ece # v2.13.1
        with:
          vite-config-path: vitest.config.ts
